name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check XAML bindings
        run: python tools/check_bindings.py

      - name: Publish single-file exe
        run: dotnet publish src/FreshWin/FreshWin.csproj -c Release -o publish

      # A self-contained folder trips antivirus heuristics far less often than a
      # single-file bundle, which unpacks itself at start-up. Same code, plainer shape.
      - name: Publish portable folder
        run: |
          dotnet publish src/FreshWin/FreshWin.csproj -c Release -o portable/FreshWin `
            -p:PublishSingleFile=false -p:EnableCompressionInSingleFile=false
          Compress-Archive -Path portable/FreshWin -DestinationPath publish/FreshWin-portable.zip

      - name: Write checksums
        run: |
          Get-FileHash publish/FreshWin.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  FreshWin.exe" } |
            Out-File -Encoding ascii publish/SHA256SUMS.txt
          Get-FileHash publish/FreshWin-portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  FreshWin-portable.zip" } |
            Out-File -Encoding ascii -Append publish/SHA256SUMS.txt
          Get-Content publish/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FreshWin
          path: |
            publish/FreshWin.exe
            publish/FreshWin-portable.zip
            publish/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/FreshWin.exe
            publish/FreshWin-portable.zip
            publish/SHA256SUMS.txt
